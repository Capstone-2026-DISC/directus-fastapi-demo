name: Pruebas e imagen
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Pruebas unitarias
        run: python -m pytest -q tests/test_api.py
      - name: Preparar configuración local
        run: python scripts/configure.py
      - name: Levantar servicios
        run: docker compose up --build --wait --wait-timeout 240
      - name: Probar CRUD real
        env:
          TEST_BASE_URL: http://127.0.0.1:8000
        run: python -m pytest -q tests/test_integration.py
      - name: Diagnóstico
        if: failure()
        run: docker compose logs --no-color --tail=80
      - name: Detener servicios
        if: always()
        run: docker compose down -v
      - uses: docker/setup-buildx-action@v3
      - name: Nombre de imagen
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
